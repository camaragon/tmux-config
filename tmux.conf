# Set true color
set-option -g terminal-overrides ",xterm*:Tc"
set -g mouse on

# Set prefix
unbind C-b
set -g prefix C-space
bind C-Space send-prefix

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g set-clipboard on

# set vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in current directory
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# Review the current pane's repository with Hunk
bind g new-window -n review -c '#{pane_current_path}' 'hunk diff --watch'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Catppuccin theme
set -g @plugin 'catppuccin/tmux#latest'
set -g @catppuccin_flavor 'mocha'

# Catppuccin status modules
set -g @catppuccin_status_modules_right "directory git application session date_time"
set -g @catppuccin_status_modules_left ""
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"
set -g @catppuccin_directory_text "#{pane_current_path}"

run '~/.tmux/plugins/tpm/tpm'

# Enter copy mode deliberately; mouse gestures only go to mouse-aware apps.
bind-key -T prefix [ copy-mode
bind-key -T prefix PPage copy-mode -u
bind-key -n WheelUpPane if-shell -F '#{mouse_any_flag}' 'send-keys -M'
bind-key -n MouseDrag1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M'
bind-key -n DoubleClick1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M'
bind-key -n TripleClick1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M'
bind-key -n MouseDown3Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M'
bind-key -n M-MouseDown3Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M'
# Escape exits copy mode immediately instead of only clearing the selection.
unbind-key -q -T copy-mode Any
unbind-key -q -T copy-mode-vi Any
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Custom layout using the existing Catppuccin palette. Display labels only:
# leave real window names intact for tools such as FirstMate.
set -g status-left-length 30
set -g status-right-length 80
set -g status-left '#[fg=#{@thm_overlay_2},bg=#{@thm_surface_0}] session #[fg=#{@thm_fg},bold]#{?#{==:#{session_name},firstmate},fm,#S} #[fg=#{@thm_surface_0},bg=#{@_ctp_status_bg},nobold]  '
set -g status-right '#[fg=#{@thm_surface_0},bg=#{@_ctp_status_bg}]#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(sh ~/.config/tmux/scripts/git-status.sh repo #{q:pane_current_path}) #[fg=#{@thm_overlay_2}]#[fg=#{@thm_blue}] #(sh ~/.config/tmux/scripts/git-status.sh branch #{q:pane_current_path}) #[fg=#{@_ctp_status_bg},bg=#{@thm_surface_0}]#[bg=#{@_ctp_status_bg},fg=#{?client_prefix,#{@thm_mauve},#{@thm_overlay_2}}] #{?client_prefix,PREFIX,C-Space} #[fg=#{@thm_mauve}]#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] %H:%M '
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#{@thm_crust},bg=#{@thm_overlay_2}] #I #[fg=#{@thm_overlay_2},bg=#{@thm_surface_0}]#[fg=#{@thm_fg}] #{?#{m/r:^(captain|fm-.*|review)$,#{window_name}},#W,#(sh ~/.config/tmux/scripts/git-status.sh repo #{q:pane_current_path})} #[fg=#{@thm_surface_0},bg=#{@_ctp_status_bg}]'
setw -g window-status-current-format '#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] #I #{?#{m/r:^(captain|fm-.*|review)$,#{window_name}},#W,#{b;qh:pane_current_path}} #[fg=#{@thm_mauve},bg=#{@_ctp_status_bg},nobold]'
